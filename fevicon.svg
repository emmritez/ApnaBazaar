<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b30"/>
      <stop offset="100%" stop-color="#00181b"/>
    </linearGradient>

    <!-- Teal Bag Gradient -->
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c4be"/>
      <stop offset="100%" stop-color="#007f7b"/>
    </linearGradient>

    <!-- Gold Pin Gradient -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdc4a"/>
      <stop offset="100%" stop-color="#e59800"/>
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38d9d4"/>
      <stop offset="100%" stop-color="#009691"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>

  <!-- UP Badge top-right -->
  <g filter="url(#glowShadow)">
    <path d="M 335 90 L 415 90 A 18 18 0 0 1 433 108 L 433 138 A 18 18 0 0 1 415 156 L 355 156 L 335 174 L 335 156 A 18 18 0 0 1 317 138 L 317 108 A 18 18 0 0 1 335 90 Z" fill="#e59800"/>
    <text x="375" y="137" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="1">UP</text>
  </g>

  <!-- Shopping Bag Handle -->
  <path d="M 206 178 C 206 130 306 130 306 178" fill="none" stroke="url(#handleGrad)" stroke-width="22" stroke-linecap="round"/>
  <circle cx="206" cy="182" r="11" fill="#005754"/>
  <circle cx="306" cy="182" r="11" fill="#005754"/>

  <!-- Shopping Bag Body -->
  <g filter="url(#dropShadow)">
    <path d="M 172 186 L 340 186 Q 346 186 349 192 L 388 358 Q 392 374 376 374 L 136 374 Q 120 374 124 358 L 163 192 Q 166 186 172 186 Z" fill="url(#bagGrad)"/>
    <!-- Subtle shade on right bag facet -->
    <path d="M 256 186 L 340 186 Q 346 186 349 192 L 388 358 Q 392 374 376 374 L 256 374 Z" fill="#000000" opacity="0.12"/>
  </g>

  <!-- Location Map Pin & Tag (Front Center) -->
  <g filter="url(#glowShadow)">
    <!-- Pin Head & Body -->
    <path d="M 256 214 C 218 214 188 244 188 282 C 188 328 256 392 256 392 C 256 392 324 328 324 282 C 324 244 294 214 256 214 Z" fill="url(#pinGrad)"/>
    <!-- Half-shade on Pin for 3D effect -->
    <path d="M 256 214 C 294 214 324 244 324 282 C 324 328 256 392 256 392 Z" fill="#d98200" opacity="0.4"/>
    <!-- Pin Center Hole -->
    <circle cx="256" cy="276" r="28" fill="#0a2a2e"/>

    <!-- Reseller Price Tag overlapping -->
    <g transform="translate(300, 240) rotate(35)">
      <rect x="0" y="0" width="48" height="32" rx="7" fill="#ffffff"/>
      <circle cx="10" cy="16" r="4.5" fill="#e59800"/>
      <path d="M 20 10 L 40 10 M 20 16 L 36 16 M 20 22 L 32 22" stroke="#00a49f" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Swoosh Arc -->
    <path d="M 124 340 Q 160 388 240 380" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- AB Bottom Text -->
  <text x="256" y="445" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    Apna<tspan fill="#00c4be">Bazaar</tspan>
  </text>
</svg>