<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Aapka Firebase Config (Project Settings se copy kiya hua)
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "apnabazaar-in.firebaseapp.com",
  projectId: "apnabazaar-in",
  storageBucket: "apnabazaar-in.appspot.com",
  messagingSenderId: "...",
  appId: "..."
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const adsGrid = document.getElementById('adsGrid');
const postModal = document.getElementById('postModal');

document.getElementById('sellBtn').onclick = () => postModal.classList.remove('hidden');
document.getElementById('closeModal').onclick = () => postModal.classList.add('hidden');

async function loadAds() {
  try {
    const snap = await getDocs(collection(db, "apnaBazaar_ads"));
    adsGrid.innerHTML = "";
    if(snap.empty){
      adsGrid.innerHTML = "<p class='col-span-full text-center'>Koi ad nahi, pehla ad aap post karo!</p>";
      return;
    }
    snap.forEach(doc => {
      const d = doc.data();
      adsGrid.innerHTML += `
        <div class="bg-white rounded-xl shadow overflow-hidden">
          <img src="${d.imageUrl || 'https://via.placeholder.com/300'}" class="h-40 w-full object-cover">
          <div class="p-3">
            <p class="font-bold">₹${d.price}</p>
            <p class="text-sm truncate">${d.title}</p>
            <p class="text-xs text-gray-500">${d.location}</p>
          </div>
        </div>`;
    });
  } catch(e) {
    adsGrid.innerHTML = "Error: " + e.message;
  }
}

document.getElementById('postAdBtn').onclick = async () => {
  const btn = document.getElementById('postAdBtn');
  btn.innerText = "Posting...";
  btn.disabled = true;
  try {
    await addDoc(collection(db, "apnaBazaar_ads"), {
      title: document.getElementById('title').value,
      price: document.getElementById('price').value,
      category: document.getElementById('category').value,
      location: document.getElementById('location').value,
      desc: document.getElementById('desc').value,
      imageUrl: document.getElementById('imageUrl').value,
      createdAt: Date.now()
    });
    postModal.classList.add('hidden');
    alert("Ho gaya Post!");
    loadAds();
  } catch(e) {
    alert("Error: " + e.message);
  }
  btn.innerText = "Post Ad";
  btn.disabled = false;
};
loadAds();
</script>
